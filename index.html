<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer 3D AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #eee;
    }

    .viewer {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      overflow: hidden;
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      margin-bottom: 20px;
    }

    model-viewer {
      width: 100%;
      height: 380px;
      background: transparent;
      --poster-color: transparent;
    }

    .buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    .btn {
      flex: 1;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:hover { opacity: .88; }

    .btn-google {
      background: #4285f4;
      color: #fff;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #222;
      border: 1px solid #333;
      color: #eee;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: .85rem;
      z-index: 999;
      transition: transform .25s;
      text-align: center;
      max-width: 90vw;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      model-viewer { height: 300px; }
      .buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <h1>Viewer 3D</h1>

  <div class="viewer">
    <model-viewer
      id="mv"
      src="https://3dmeals-assets.s3.il-central-1.amazonaws.com/magnifiko/models/glb/trio_de_burrata.glb"
      alt="Modèle 3D"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="1"
      ar
      ar-modes="scene-viewer quick-look"
      ar-scale="fixed"
      ar-placement="floor"
    ></model-viewer>
  </div>

  <div class="buttons">
    <button class="btn btn-google" id="btn-ar">Voir en AR</button>
  </div>

  <div id="toast"></div>

  <script>
    const mv = document.getElementById('mv');

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 3500);
    }

    document.getElementById('btn-ar').addEventListener('click', () => {
      if (!mv.canActivateAR) {
        toast('AR non disponible — nécessite Android avec ARCore ou iPhone/iPad');
        return;
      }
      mv.activateAR();
    });
  </script>

</body>
</html>
